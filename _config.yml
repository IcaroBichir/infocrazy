# Site wide configuration

title:            "Icaro Bichir"
locale:           en_US
url:              https://icarobichir.com
description:      "I bring ideas to life — through lenses, shelves, and stories. Let me bring yours too."

# Jekyll configuration

permalink:   /:categories/:title/
markdown:    kramdown
highlighter: rouge
sass:
  sass_dir: _sass
  style: compressed
  quiet_deps: true
plugins:
  - jekyll-sitemap

kramdown:
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  enable_coderay: false

# Site owner
owner:
  name: "Icaro Bichir"
  avatar: bio-photo.jpg
  bio: "Content Creator & Photographer. I bring ideas to life — through lenses, shelves, and stories."
  email: imbcollabs@gmail.com
  github: icarobichir
  linkedin: icarobichir
  instagram: icarobichir
  tiktok: shelftherapystudio
  behance: icarobichir1

include: [".htaccess"]
exclude: ["lib", "config.rb", "Capfile", "config", "log", "Rakefile", "Rakefile.rb", "tmp", "less", "*.sublime-project", "*.sublime-workspace", "test", "spec", "Gruntfile.js", "package.json", "node_modules", "Gemfile", "Gemfile.lock", "LICENSE", "README.md", "partners"]
